<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="theme-color" content="#FFF6FB">
<title>PARTY HOUSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PARTY HOUSE. An app for a grade 2 girl, because an uncle promised.

   Fully bilingual: one button swaps the entire interface between
   English and Spanish, because she speaks both and neither should feel
   like the "other" one. Every label, title, hint and bit of praise goes
   through t(). The word games deliberately stay cross-language, since
   translating between the two is the point of those.

   Twenty-six games, all generated rather than listed, grouped into
   Adding, Taking Away, Times Tables, Numbers, Money and Time, then
   Words, Calendar and Look and Say. Difficulty rises and falls on its
   own, per game, remembered between visits.

   Rules it obeys, which are not grown-up app rules:
     - Enormous tap targets. Small fingers, a phone in the back of a car.
     - It never says wrong. It says nearly, and lets her go again.
     - No timers, no losing, no way to fail. She leaves when bored.
     - A hint is always free. Stuck is fine; stuck with no way out is not.
     - Progress is kept. Stars, badges, levels and language all survive.
     - Sound mutes in one tap, because parents exist.
     - Grade 2, pitched at grade 2. Kids notice being talked down to.

   noindex is in the head. Everything else is throwaway.
   ===================================================================== */
:root{
  --pink:#FF3D8F;--purple:#9B5CFF;--aqua:#25D9E8;--lemon:#FFD83D;
  --lime:#6FE04E;--tang:#FF8A3D;--ink:#2B1145;--paper:#FFF6FB;
  --display:"Baloo 2",system-ui,cursive;--body:Fredoka,system-ui,sans-serif;
  --pop:6px 6px 0 var(--ink);--pop-sm:4px 4px 0 var(--ink);--tabh:76px;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;font-family:var(--body);color:var(--ink);
  background:
    radial-gradient(900px 560px at 10% -6%,#FFE3F2 0%,transparent 60%),
    radial-gradient(800px 520px at 94% 6%,#E4E0FF 0%,transparent 62%),
    radial-gradient(900px 600px at 50% 104%,#D8FBFF 0%,transparent 60%),
    var(--paper);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));
}
button{font-family:inherit}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:11px;height:16px;border-radius:3px;opacity:.9;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti i{animation:none;opacity:.28}}
.wrap{max-width:720px;margin:0 auto;padding:0 15px}

.bar{position:sticky;top:0;z-index:60;background:rgba(255,246,251,.94);backdrop-filter:blur(10px);border-bottom:4px solid var(--ink)}
.bar .in{max-width:720px;margin:0 auto;padding:9px 15px;display:flex;align-items:center;gap:8px}
.back{font-family:var(--display);font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:9px 13px;cursor:pointer;box-shadow:var(--pop-sm);display:none;white-space:nowrap;flex:none}
.back.on{display:block}
.back:active{transform:translate(3px,3px);box-shadow:none}
.stars{flex:1;min-width:0;display:flex;align-items:center;gap:7px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 12px;box-shadow:var(--pop-sm)}
.stars .n{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.jar{flex:1;height:12px;background:#F0E6F6;border-radius:999px;overflow:hidden;border:2px solid var(--ink);min-width:26px}
.jar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lemon),var(--tang));transition:width .35s ease}
.iconbtn{font-size:16px;font-family:var(--display);font-weight:800;background:#fff;border:3px solid var(--ink);border-radius:999px;height:42px;min-width:42px;padding:0 10px;cursor:pointer;box-shadow:var(--pop-sm);line-height:1;flex:none}
.iconbtn:active{transform:translate(3px,3px);box-shadow:none}
.iconbtn.lang{background:var(--lemon)}

.screen{display:none;padding:20px 0 30px}
.screen.on{display:block;animation:slide .22s ease}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-family:var(--display);font-weight:800;margin:0;font-size:clamp(40px,12vw,76px);line-height:.88;text-transform:uppercase;text-align:center}
h1 span{display:block;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 rgba(43,17,69,.15)}
h1 .a{color:var(--pink)}h1 .b{color:var(--purple)}
h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,34px);text-align:center;margin:0 0 4px;text-transform:uppercase}
.sub{text-align:center;font-size:14.5px;font-weight:500;margin:0 0 18px;opacity:.75}
.card{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:20px 16px;box-shadow:var(--pop)}
.hero{position:relative;max-width:330px;margin:16px auto 0}
.frame{border:6px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:9px 9px 0 var(--pink);background:#fff;transform:rotate(-1.4deg)}
.frame img{display:block;width:100%;height:auto}
.sticker{position:absolute;font-family:var(--display);font-weight:800;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 14px;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;z-index:3}
.s1{top:-13px;left:-6px;transform:rotate(-8deg);color:var(--purple)}
.s2{bottom:-13px;right:-4px;transform:rotate(7deg);color:var(--pink)}
.hello{display:block;text-align:center;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;opacity:.7}

.grouphead{
  font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;
  letter-spacing:.04em;margin:26px 0 10px;display:flex;align-items:center;gap:9px;
}
.grouphead::after{content:"";flex:1;height:4px;background:var(--ink);border-radius:9px;opacity:.16}
.grouphead .em{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{
  font-family:var(--display);font-weight:800;font-size:15px;cursor:pointer;text-align:left;
  background:#fff;border:4px solid var(--ink);border-radius:20px;padding:14px 13px;
  box-shadow:var(--pop-sm);color:var(--ink);display:flex;flex-direction:column;gap:4px;
  transition:transform .08s,box-shadow .08s;
}
.tile:active{transform:translate(4px,4px);box-shadow:none}
.tile .em{font-size:27px;line-height:1}
.tile small{font-size:11px;font-weight:500;opacity:.72;font-family:var(--body);line-height:1.3}
.tile .lv{font-size:10.5px;font-weight:700;font-family:var(--body);color:var(--purple)}
.tile:nth-child(6n+1){background:#FFE3F2}.tile:nth-child(6n+2){background:#E7E0FF}
.tile:nth-child(6n+3){background:#D8FBFF}.tile:nth-child(6n+4){background:#FFF3C9}
.tile:nth-child(6n+5){background:#E4FBDD}.tile:nth-child(6n+6){background:#FFE9D6}

.q{font-family:var(--display);font-weight:800;text-align:center;font-size:clamp(38px,12vw,68px);line-height:1.08;margin:2px 0 4px}
.q.small{font-size:clamp(24px,7vw,40px)}
.qsub{text-align:center;font-size:14.5px;font-weight:600;opacity:.7;margin-bottom:15px}
.visual{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;margin:0 0 15px}
.hintbox{max-height:0;overflow:hidden;opacity:0;transition:max-height .25s,opacity .2s,margin .25s;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.hintbox.show{max-height:280px;opacity:1;margin-bottom:15px}
.hintrow{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;background:#F7F0FB;border:3px solid var(--ink);border-radius:16px;padding:8px 11px;font-size:clamp(16px,4.6vw,23px)}
.hintrow.gone{opacity:.26}
.hintop{font-family:var(--display);font-weight:800;font-size:24px;padding:0 3px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts.two{grid-template-columns:1fr 1fr}.opts.wide{grid-template-columns:1fr 1fr}
.opt{font-family:var(--display);font-weight:800;font-size:clamp(24px,7.5vw,36px);background:#fff;border:4px solid var(--ink);border-radius:20px;padding:17px 6px;cursor:pointer;box-shadow:var(--pop-sm);color:var(--ink);transition:transform .08s,box-shadow .08s,background .15s}
.opts.wide .opt{font-size:clamp(15px,4.2vw,21px);padding:17px 8px}
.opt:active{transform:translate(3px,3px);box-shadow:none}
.opt.good{background:var(--lime);animation:pop .3s ease}
.opt.nearly{background:#FFD9E6}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
.say{text-align:center;font-family:var(--display);font-weight:800;font-size:21px;min-height:28px;margin-top:14px;color:var(--purple)}
.streak{text-align:center;font-size:12.5px;font-weight:600;opacity:.75;margin-top:2px;min-height:17px}
.helprow{text-align:center;margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.help{font-weight:700;font-size:13.5px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:9px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.help:active{transform:translate(3px,3px);box-shadow:none}
.lvpill{font-weight:700;font-size:12px;background:var(--lemon);border:3px solid var(--ink);border-radius:999px;padding:8px 14px}
.week{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.day{font-family:var(--display);font-weight:800;font-size:11.5px;background:#fff;border:3px solid var(--ink);border-radius:11px;padding:7px 6px;min-width:41px;text-align:center}
.day.here{background:var(--lemon)}
.day.target{color:transparent;position:relative}
.day.target::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--purple);font-size:17px}
.swatch{width:100%;max-width:280px;height:130px;margin:0 auto;border:5px solid var(--ink);border-radius:22px;box-shadow:var(--pop)}
.coin{width:60px;height:60px;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--ink)}
svg.clock,svg.shape{display:block;margin:0 auto}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:16px}
@media(min-width:560px){.badges{grid-template-columns:repeat(4,1fr)}}
.badge{background:#fff;border:4px solid var(--ink);border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--pop-sm);opacity:.32;filter:grayscale(1)}
.badge.got{opacity:1;filter:none;background:#FFF3C9}
.badge .em{font-size:29px;display:block;margin-bottom:5px}
.badge b{font-family:var(--display);font-weight:800;font-size:12.5px;display:block;line-height:1.2}
.badge small{font-size:10px;font-weight:500;opacity:.75;display:block;margin-top:3px}
.bignum{font-family:var(--display);font-weight:800;font-size:clamp(56px,18vw,96px);text-align:center;line-height:1;color:var(--tang);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}

/* ---------- prizes ----------
   Stars are earned forever (badges read that) and spent from a balance,
   so buying a sticker never takes a badge away. Nothing here can be
   lost, only gained, which is the whole point at seven. */
.shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:15px 12px;box-shadow:var(--pop);margin-top:14px;min-height:74px}
.shelf .sk{font-size:31px;line-height:1;filter:grayscale(1);opacity:.22}
.shelf .sk.got{filter:none;opacity:1;animation:pop .35s ease}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(min-width:560px){.shop{grid-template-columns:repeat(3,1fr)}}
.buy{
  font-family:var(--display);font-weight:800;font-size:14px;cursor:pointer;text-align:center;
  background:#fff;border:4px solid var(--ink);border-radius:18px;padding:13px 8px;
  box-shadow:var(--pop-sm);color:var(--ink);display:flex;flex-direction:column;gap:5px;align-items:center;
}
.buy:active{transform:translate(3px,3px);box-shadow:none}
.buy .em{font-size:28px;line-height:1}
.buy .cost{font-family:var(--body);font-weight:700;font-size:11.5px;background:var(--lemon);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.buy.owned{background:#E4FBDD}
.buy.owned .cost{background:var(--lime)}
.buy.cant{opacity:.45}
.buy.on{background:var(--lemon)}
.wheelwrap{text-align:center;margin-top:16px}
.wheel{
  width:190px;height:190px;border-radius:50%;margin:0 auto 14px;
  border:6px solid var(--ink);box-shadow:var(--pop);position:relative;
  transition:transform 2.6s cubic-bezier(.17,.67,.2,1);
  background:conic-gradient(#FF3D8F 0 45deg,#9B5CFF 45deg 90deg,#25D9E8 90deg 135deg,#FFD83D 135deg 180deg,
    #6FE04E 180deg 225deg,#FF8A3D 225deg 270deg,#FF3D8F 270deg 315deg,#9B5CFF 315deg 360deg);
}
.wheelwrap .pin{font-size:26px;line-height:1;margin-bottom:-12px;position:relative;z-index:2}
.wheelmsg{font-family:var(--display);font-weight:800;font-size:19px;min-height:26px;margin-top:10px;color:var(--purple)}

/* unlockable backgrounds */
body.th-candy{background:radial-gradient(900px 560px at 10% -6%,#FFD6EC 0%,transparent 60%),radial-gradient(800px 520px at 94% 6%,#FFE9C9 0%,transparent 62%),radial-gradient(900px 600px at 50% 104%,#E7D6FF 0%,transparent 60%),#FFF4F9}
body.th-mint{background:radial-gradient(900px 560px at 10% -6%,#CFF6E4 0%,transparent 60%),radial-gradient(800px 520px at 94% 6%,#D6F0FF 0%,transparent 62%),radial-gradient(900px 600px at 50% 104%,#FFF6CE 0%,transparent 60%),#F2FFFA}
body.th-space{background:radial-gradient(900px 560px at 10% -6%,#D7D9FF 0%,transparent 60%),radial-gradient(800px 520px at 94% 6%,#E9D6FF 0%,transparent 62%),radial-gradient(900px 600px at 50% 104%,#CFE2FF 0%,transparent 60%),#F3F2FF}
body.th-sunset{background:radial-gradient(900px 560px at 10% -6%,#FFD9C2 0%,transparent 60%),radial-gradient(800px 520px at 94% 6%,#FFC9DD 0%,transparent 62%),radial-gradient(900px 600px at 50% 104%,#FFEFC2 0%,transparent 60%),#FFF7F0}
body.th-jungle{background:radial-gradient(900px 560px at 10% -6%,#D8F5C7 0%,transparent 60%),radial-gradient(800px 520px at 94% 6%,#CDEFE0 0%,transparent 62%),radial-gradient(900px 600px at 50% 104%,#FFF2CC 0%,transparent 60%),#F5FFF0}

/* her stickers, floating around the photo on Home */
.hero .stuck{position:absolute;font-size:26px;z-index:4;pointer-events:none;filter:drop-shadow(2px 2px 0 rgba(43,17,69,.35))}
.nails{display:grid;gap:15px;align-items:center}
@media(min-width:560px){.nails{grid-template-columns:1fr 1fr}}
.nails img{display:block;width:100%;height:auto;border-radius:16px;border:3px solid var(--ink)}
.nails h3{font-family:var(--display);font-weight:800;font-size:23px;margin:0 0 8px}
.nails p{margin:0 0 8px;font-size:14.5px;font-weight:500;line-height:1.5}
.by{display:inline-block;font-weight:700;font-size:12.5px;background:var(--lime);border:3px solid var(--ink);border-radius:999px;padding:6px 13px;box-shadow:3px 3px 0 var(--ink)}
.big{font-family:var(--display);font-weight:800;font-size:clamp(19px,5vw,27px);background:var(--lemon);color:var(--ink);border:5px solid var(--ink);border-radius:999px;padding:17px 30px;cursor:pointer;box-shadow:7px 7px 0 var(--ink);text-transform:uppercase}
.big:active{transform:translate(7px,7px);box-shadow:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(255,246,251,.96);backdrop-filter:blur(10px);border-top:4px solid var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{font-family:var(--display);font-weight:800;font-size:11px;cursor:pointer;background:transparent;border:3px solid transparent;border-radius:16px;padding:7px 2px 6px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .em{font-size:22px;line-height:1}
.tab[aria-pressed="true"]{background:#fff;border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
footer{margin-top:40px;text-align:center;font-size:12.5px;font-weight:500;opacity:.6;line-height:1.7}
</style>
</head>
<body>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<div class="bar"><div class="in">
  <button class="back" id="back"></button>
  <div class="stars">
    <span aria-hidden="true">&starf;</span>
    <span class="n" id="starCount">0</span>
    <span class="jar"><span id="jarFill"></span></span>
  </div>
  <button class="iconbtn lang" id="lang">ES</button>
  <button class="iconbtn" id="sound" aria-label="Sound">&#128266;</button>
</div></div>

<div class="wrap">

  <section class="screen on" id="s-home">
    <span class="hello" data-t="welcome"></span>
    <h1><span class="a">Party</span><span class="b">House</span></h1>
    <div class="hero">
      <div class="sticker s1" data-t="theBoss"></div>
      <div class="frame"><img src="img/her.jpg" alt="Party House"></div>
      <div class="sticker s2" data-t="grade"></div>
    </div>
    <div class="tiles" id="homeTiles" style="margin-top:26px"></div>
    <footer data-t="footer"></footer>
  </section>

  <section class="screen" id="s-maths">
    <h2 data-t="maths"></h2><p class="sub" data-t="mathsSub"></p>
    <div id="mathsGroups"></div>
  </section>

  <section class="screen" id="s-world">
    <h2 data-t="world"></h2><p class="sub" data-t="worldSub"></p>
    <div id="worldGroups"></div>
  </section>

  <section class="screen" id="s-game">
    <h2 id="gTitle"></h2><p class="sub" id="gSub"></p>
    <div class="card">
      <div class="visual" id="gVisual"></div>
      <div class="q" id="gQ"></div>
      <div class="qsub" id="gQSub"></div>
      <div class="hintbox" id="gHint"></div>
      <div class="opts" id="gOpts"></div>
      <div class="say" id="gSay"></div>
      <div class="streak" id="gStreak"></div>
      <div class="helprow">
        <button class="help" id="gHelp"></button>
        <span class="lvpill" id="gLevel"></span>
      </div>
    </div>
  </section>

  <section class="screen" id="s-stars">
    <h2 data-t="myStars"></h2><p class="sub" data-t="starsSub"></p>
    <div class="bignum" id="bigStars">0</div>
    <p class="sub" id="starsLine" style="margin-top:8px"></p>

    <div class="grouphead" data-t="grpWheel"></div>
    <div class="card wheelwrap">
      <div class="pin">&#128071;</div>
      <div class="wheel" id="wheel"></div>
      <button class="big" id="spin"></button>
      <div class="wheelmsg" id="wheelMsg"></div>
      <p class="sub" id="spinHint" style="margin:10px 0 0"></p>
    </div>

    <div class="grouphead" data-t="grpStickers"></div>
    <p class="sub" id="stickerHint" style="margin-bottom:0"></p>
    <div class="shelf" id="shelf"></div>
    <div class="shop" id="stickerShop"></div>

    <div class="grouphead" data-t="grpThemes"></div>
    <div class="shop" id="themeShop"></div>

    <div class="grouphead" data-t="grpBadges"></div>
    <div class="badges" id="badges"></div>
  </section>

  <section class="screen" id="s-party">
    <h2 data-t="partyRoom"></h2><p class="sub" data-t="partySub"></p>
    <div class="card" style="text-align:center">
      <button class="big" id="go" data-t="pressBtn"></button>
      <div id="yay" style="margin-top:14px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--purple);min-height:26px"></div>
    </div>
  </section>

  <section class="screen" id="s-nails">
    <h2 data-t="myNails"></h2><p class="sub" data-t="nailsSub"></p>
    <div class="card nails">
      <img src="img/her-nails.jpg" alt="Nails">
      <div>
        <h3 data-t="nailsH"></h3>
        <p data-t="nailsP1"></p>
        <p data-t="nailsP2"></p>
        <span class="by" data-t="byDani"></span>
      </div>
    </div>
  </section>
</div>

<nav class="tabs"><div class="in">
  <button class="tab" data-tab="home"  aria-pressed="true"><span class="em">&#127968;</span><span data-t="home"></span></button>
  <button class="tab" data-tab="maths" aria-pressed="false"><span class="em">&#10133;</span><span data-t="maths"></span></button>
  <button class="tab" data-tab="world" aria-pressed="false"><span class="em">&#127758;</span><span data-t="world"></span></button>
  <button class="tab" data-tab="stars" aria-pressed="false"><span class="em">&#11088;</span><span data-t="stars"></span></button>
</div></nav>

<script>
(function(){
"use strict";

function beep(notes,len){if(!soundOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  notes.forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(.0001,ac.currentTime+i*len);g.gain.exponentialRampToValueAtTime(.12,ac.currentTime+i*len+.012);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*len+len);o.connect(g);g.connect(ac.destination);
  o.start(ac.currentTime+i*len);o.stop(ac.currentTime+i*len+len+.02);});}catch(e){}}

/* ---------------- prizes ----------------
   stars      = earned forever. badges read this and it never goes down.
   spent      = what she has bought.
   balance    = stars - spent, which is what the shop uses.
   Nothing can be lost here, only gained. That matters at seven. */
var spent=parseInt(store('ph-spent')||'0',10)||0;
var spins=parseInt(store('ph-spins')||'0',10)||0;   /* free spins already taken */
var owned={}; try{owned=JSON.parse(store('ph-owned')||'{}');}catch(e){owned={};}

var SPIN_EVERY=25;
function balance(){return Math.max(0,stars-spent);}
function spinsEarned(){return Math.floor(stars/SPIN_EVERY);}
function spinsLeft(){return Math.max(0,spinsEarned()-spins);}

  return [['-6px','auto','auto','-14px'],['auto','-12px','-8px','auto'],['46%','auto','auto','-20px'],

function paintStuck(){
  var hero=document.querySelector('.hero'); if(!hero) return;
  [].slice.call(hero.querySelectorAll('.stuck')).forEach(function(e){e.remove();});
  var mine=STICKERS.filter(function(s){return owned['st:'+s];}).slice(0,6);
  var pos=stickerPositions();
  mine.forEach(function(s,i){
    var e=document.createElement('span'); e.className='stuck'; e.textContent=s;
    e.style.top=pos[i][0]; e.style.right=pos[i][1]; e.style.bottom=pos[i][2]; e.style.left=pos[i][3];
    hero.appendChild(e);
  });
}
function paintPrizes(){
  /* wheel */
  var left=spinsLeft();
  document.getElementById('spin').textContent=t('spin')+(left>1?(' ×'+left):'');
  document.getElementById('spin').style.opacity=left>0?1:.45;
  document.getElementById('spinHint').textContent = left>0
    ? t('spinReady')
    : t('spinWait').replace('%n', String(SPIN_EVERY - (stars % SPIN_EVERY)));

  /* stickers */
  document.getElementById('stickerHint').textContent=t('stickerHint');
  var shelf=document.getElementById('shelf'); shelf.innerHTML='';
  STICKERS.forEach(function(s){
    var e=document.createElement('span'); e.className='sk'+(owned['st:'+s]?' got':''); e.textContent=s;
    shelf.appendChild(e);
  });
  var shop=document.getElementById('stickerShop'); shop.innerHTML='';
  STICKERS.filter(function(s){return !owned['st:'+s];}).slice(0,6).forEach(function(s){
    var b=document.createElement('button');
    var can=balance()>=STICKER_COST;
    b.className='buy'+(can?'':' cant');
    b.innerHTML='<span class="em">'+s+'</span><span class="cost">'+t('cost').replace('%n',STICKER_COST)+'</span>';
    b.addEventListener('click',function(){
      if(balance()<STICKER_COST){ flash(t('notEnough')); TRY(); return; }
      spent+=STICKER_COST; store('ph-spent',String(spent));
      owned['st:'+s]=1; store('ph-owned',JSON.stringify(owned));
      WIN(); drop(12,true); paintStars(); paintStuck();
    });
    shop.appendChild(b);
  });

  /* themes */
  var tshop=document.getElementById('themeShop'); tshop.innerHTML='';
  THEMES.forEach(function(th){
    var key='th:'+th[0], have=th[3]===0||owned[key], on=theme===th[0];
    var can=balance()>=th[3];
    var b=document.createElement('button');
    b.className='buy'+(on?' on':(have?' owned':(can?'':' cant')));
    b.innerHTML='<span class="em">'+th[1]+'</span>'+txt(th[2])
      +'<span class="cost">'+(on?t('wearing'):(have?t('owned'):t('cost').replace('%n',th[3])))+'</span>';
    b.addEventListener('click',function(){
      if(!have){
        if(balance()<th[3]){ flash(t('notEnough')); TRY(); return; }
        spent+=th[3]; store('ph-spent',String(spent));
        owned[key]=1; store('ph-owned',JSON.stringify(owned));
        drop(14,true);
      }
      theme=th[0]; store('ph-theme',theme); applyTheme(); WIN(); paintStars();
    });
    tshop.appendChild(b);
  });
}
function flash(msg){ var m=document.getElementById('wheelMsg'); m.textContent=msg; setTimeout(function(){ if(m.textContent===msg) m.textContent=''; },1800); }

function paintStars(){
  starCount.textContent=balance();
  jarFill.style.width=Math.min(100,(stars%SPIN_EVERY)/SPIN_EVERY*100)+'%';
  document.getElementById('bigStars').textContent=balance();
  document.getElementById('starsLine').textContent=
    balance()+' '+t('balance')+' · '+stars+' ★ '+t('bestStreak').toLowerCase()+' '+best
    +' · '+Object.keys(played).length+' '+t('of')+' '+GAMES.length+' '+t('tried');
  var wrap=document.getElementById('badges'); wrap.innerHTML='';
  BADGES.forEach(function(b){
    var got=false; try{got=!!b[3]();}catch(e){}
    var d=document.createElement('div'); d.className='badge'+(got?' got':'');
    d.innerHTML='<span class="em">'+b[0]+'</span><b>'+txt(b[1])+'</b><small>'+txt(b[2])+'</small>';
    wrap.appendChild(d);
  });
  paintPrizes();
}
function addStar(){stars++;store('ph-stars',String(stars));paintStars();if(stars%10===0)drop(30,true);}

/* the wheel */
var spinning=false, turn=0;
document.getElementById('spin').addEventListener('click',function(){
  if(spinning) return;
  if(spinsLeft()<=0){ flash(t('spinWait').replace('%n',String(SPIN_EVERY-(stars%SPIN_EVERY)))); TRY(); return; }
  spinning=true;
  spins++; store('ph-spins',String(spins));
  turn += 1440 + R(360);
  document.getElementById('wheel').style.transform='rotate('+turn+'deg)';
  document.getElementById('wheelMsg').textContent='';
  beep([392,523,659],.08);
  setTimeout(function(){
    spinning=false;
    var locked=STICKERS.filter(function(s){return !owned['st:'+s];});
    if(locked.length && Math.random()<.65){
      var s=pick(locked);
      owned['st:'+s]=1; store('ph-owned',JSON.stringify(owned));
      document.getElementById('wheelMsg').textContent=t('wonSticker')+' '+s;
      paintStuck();
    }else{
      var bonus=pick([5,5,10,10,15,20]);
      stars+=bonus; store('ph-stars',String(stars));
      document.getElementById('wheelMsg').textContent=t('wonStars').replace('%n',String(bonus));
    }
    WIN(); drop(40,true); paintStars();
  },2700);
});

{id:'skip',cat:'maths',grp:'grpNum',em:'🦘',name:B('Skip Counting','Contar Salteado'),note:B('What comes next','Qué sigue'),

  return{q:seq.join(', ')+', ?',small:true,qsub:B('Counting in '+s+'s','De '+s+' en '+s),ans:ans,opts:numOpts(ans,s)};}},
{id:'compare',cat:'maths',grp:'grpNum',em:'⚖️',name:B('Bigger or Smaller','Mayor o Menor'),note:B('Which is more','Cuál es más'),
 make:function(L){var m=L===1?20:100,a=1+R(m),b=1+R(m);if(a===b)b=a+1;var bg=Math.random()<.5;

{id:'oddeven',cat:'maths',grp:'grpNum',em:'⚖',name:B('Odd or Even','Par o Impar'),note:B('Two choices','Dos opciones'),

   ans:LANG==='es'?(even?'par':'impar'):(even?'even':'odd'),

{id:'place',cat:'maths',grp:'grpNum',em:'📦',name:B('Tens and Ones','Decenas y Unidades'),note:B('Break it up','Sácale las partes'),
 make:function(L){var n=11+R(L===1?68:88),tens=Math.floor(n/10),ones=n%10,askTens=Math.random()<.5;
  return{q:String(n),qsub:askTens?B('How many TENS?','¿Cuántas DECENAS?'):B('How many ONES?','¿Cuántas UNIDADES?'),
   ans:askTens?tens:ones,opts:numOpts(askTens?tens:ones,2)};}},

/* ---- MONEY AND TIME ---- */
{id:'money',cat:'maths',grp:'grpMoney',em:'🪙',name:B('Money','Dinero'),note:B('Canadian coins','Monedas canadienses'),
 make:function(L){var COINS=[[5,'5¢','#C9CDD2'],[10,'10¢','#C9CDD2'],[25,'25¢','#C9CDD2'],[100,'$1','#E8C86A'],[200,'$2','#E8C86A']];
  var howMany=L===1?2:(2+R(2)),got=[],tot=0;
  for(var i=0;i<howMany;i++){var c=COINS[R(L===1?3:5)];got.push(c);tot+=c[0];}
  var lab=function(v){return v>=100?('$'+(v/100).toFixed(2)):(v+'¢');};
  var raw=numOpts(tot,12); if(raw.indexOf(tot)===-1)raw[0]=tot;
  return{q:'',qsub:B('Add the coins up','Suma las monedas'),coins:got,ans:lab(tot),opts:shuffle(raw.map(lab)),wide:true};}},
{id:'time',cat:'maths',grp:'grpMoney',em:'🕒',name:B('Clocks','Relojes'),note:B('What time is it','Qué hora es'),
 make:function(L){var h=1+R(12),mins=L===1?[0,30]:[0,15,30,45],m=pick(mins);
  var say=function(hh,mm){ if(LANG==='es'){ if(mm===0)return hh+':00'; if(mm===30)return hh+' y media'; if(mm===15)return hh+' y cuarto'; return ((hh%12)+1)+' menos cuarto'; }
    if(mm===0)return hh+" o'clock"; if(mm===30)return 'half past '+hh; if(mm===15)return 'quarter past '+hh; return 'quarter to '+((hh%12)+1); };
  var ans=say(h,m),pool=[];for(var i=0;i<16;i++)pool.push(say(1+R(12),pick(mins)));
  return{q:'',qsub:B('Read the clock','Lee el reloj'),clock:[h,m],ans:ans,opts:wordOpts(ans,pool),wide:true};}},

{id:'colours',cat:'world',grp:'grpLook',em:'🎨',name:B('Colours','Colores'),note:B('Name the colour','Di el color'),
 make:function(){var es=Math.random()<.5,L2=es?1:0,c=pick(PALETTE);
  return{q:'',qsub:es?B('¿De qué color es?','¿De qué color es?'):B('What colour is this?','What colour is this?'),
   swatch:c[2],ans:c[L2],opts:wordOpts(c[L2],PALETTE.map(function(p){return p[L2];})),wide:true};}},

 make:function(){var S=[['circle','círculo'],['square','cuadrado'],['triangle','triángulo'],['rectangle','rectángulo'],['star','estrella'],['heart','corazón'],['oval','óvalo'],['diamond','rombo']];
  var es=Math.random()<.5,L2=es?1:0,s=pick(S);
  return{q:'',qsub:es?B('¿Qué figura es?','¿Qué figura es?'):B('What shape is this?','What shape is this?'),
   shape:s[0],ans:s[L2],opts:wordOpts(s[L2],S.map(function(x){return x[L2];})),wide:true};}}
];

/* ---------------- drawing ---------------- */
function clockSVG(h,m){
  var a=function(deg,len){var r=(deg-90)*Math.PI/180;return[60+Math.cos(r)*len,60+Math.sin(r)*len];};
  var hm=a((h%12)*30+m*.5,28),mm=a(m*6,40),ticks='';
  for(var i=0;i<12;i++){var p=a(i*30,48),q=a(i*30,42);
    ticks+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="#2B1145" stroke-width="3" stroke-linecap="round"/>';}
  return '<svg class="clock" width="140" height="140" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#2B1145" stroke-width="5"/>'+ticks+
    '<line x1="60" y1="60" x2="'+hm[0]+'" y2="'+hm[1]+'" stroke="#9B5CFF" stroke-width="7" stroke-linecap="round"/>'+
    '<line x1="60" y1="60" x2="'+mm[0]+'" y2="'+mm[1]+'" stroke="#FF3D8F" stroke-width="5" stroke-linecap="round"/>'+
    '<circle cx="60" cy="60" r="5" fill="#2B1145"/></svg>';
}
function shapeSVG(kind){
  var f='#FFD83D',s='stroke="#2B1145" stroke-width="5" stroke-linejoin="round"';
  var body={circle:'<circle cx="60" cy="60" r="44" fill="'+f+'" '+s+'/>',
    square:'<rect x="18" y="18" width="84" height="84" rx="6" fill="'+f+'" '+s+'/>',
    rectangle:'<rect x="10" y="32" width="100" height="56" rx="6" fill="'+f+'" '+s+'/>',
    triangle:'<polygon points="60,14 108,102 12,102" fill="'+f+'" '+s+'/>',
    star:'<polygon points="60,10 73,46 111,46 80,69 92,105 60,82 28,105 40,69 9,46 47,46" fill="'+f+'" '+s+'/>',
    heart:'<path d="M60 104S16 76 16 46a24 24 0 0 1 44-13 24 24 0 0 1 44 13c0 30-44 58-44 58z" fill="'+f+'" '+s+'/>',
    oval:'<ellipse cx="60" cy="60" rx="50" ry="34" fill="'+f+'" '+s+'/>',
    diamond:'<polygon points="60,10 106,60 60,110 14,60" fill="'+f+'" '+s+'/>'}[kind]||'';
  return '<svg class="shape" width="130" height="130" viewBox="0 0 120 120">'+body+'</svg>';
}

/* ---------------- runner ---------------- */
var GOOD=[B('Yes!','¡Sí!'),B('Perfect!','¡Perfecto!'),B('Excellent!','¡Excelente!'),B('Star!','¡Estrella!'),
  B('You got it!','¡Lo lograste!'),B('Brilliant!','¡Genial!'),B('Very good!','¡Muy bien!'),B('Amazing!','¡Increíble!'),B('Clever!','¡Qué lista!')];
var NEARLY=[B('Nearly! Try again','¡Casi! Otra vez'),B('So close!','¡Muy cerca!'),B('Have another go','Inténtalo otra vez'),
  B('Almost! One more','¡Casi! Una más'),B('Not that one, try again','Esa no, prueba otra')];

var cur=null,streak=0;
var els={title:document.getElementById('gTitle'),sub:document.getElementById('gSub'),visual:document.getElementById('gVisual'),
  q:document.getElementById('gQ'),qsub:document.getElementById('gQSub'),hint:document.getElementById('gHint'),
  opts:document.getElementById('gOpts'),say:document.getElementById('gSay'),streak:document.getElementById('gStreak'),
  help:document.getElementById('gHelp'),level:document.getElementById('gLevel')};

function levelOf(id){return Math.min(3,Math.max(1,levels[id]||1));}
function bump(id,up){levels[id]=up?Math.min(3,levelOf(id)+1):Math.max(1,levelOf(id)-1);store('ph-levels',JSON.stringify(levels));}

function ask(){
  var g=cur,L=levelOf(g.id),d=g.make(L);
  els.level.textContent=t('level')+' '+L;
  els.say.textContent='';els.hint.className='hintbox';els.hint.innerHTML='';els.visual.innerHTML='';
  els.q.className='q'+(d.small?' small':'');els.q.textContent=d.q||'';
  els.qsub.textContent=txt(d.qsub)||'';
  if(d.clock)els.visual.innerHTML=clockSVG(d.clock[0],d.clock[1]);
  if(d.shape)els.visual.innerHTML=shapeSVG(d.shape);
  if(d.swatch){var sw=document.createElement('div');sw.className='swatch';sw.style.background=d.swatch;els.visual.appendChild(sw);}
  if(d.coins)d.coins.forEach(function(c){var el=document.createElement('div');el.className='coin';el.style.background=c[2];el.textContent=c[1];els.visual.appendChild(el);});
  if(d.week){var strip=document.createElement('div');strip.className='week';
    DAYS.forEach(function(dd,k){var e=document.createElement('div');
      e.className='day'+(k===d.week[0]?' here':'')+(k===d.week[1]?' target':'');
      e.textContent=dd[d.week[2]].slice(0,3);strip.appendChild(e);});
    els.visual.appendChild(strip);}
  els.help.style.display=d.hint?'':'none';
  if(d.hint){var r1=document.createElement('div');r1.className='hintrow';r1.textContent=d.hint[0];
    var op=document.createElement('div');op.className='hintop';op.textContent=d.hint[1];
    var r2=document.createElement('div');r2.className='hintrow'+(d.hint[3]?' gone':'');r2.textContent=d.hint[2];
    els.hint.appendChild(r1);els.hint.appendChild(op);els.hint.appendChild(r2);}
  els.opts.className='opts'+(d.wide?' wide':'')+(d.two?' two':'');
  els.opts.innerHTML='';
  d.opts.forEach(function(v){
    var b=document.createElement('button');b.className='opt';b.textContent=v;
    b.addEventListener('click',function(){
      if(String(v)===String(d.ans)){
        b.classList.add('good');WIN();addStar();streak++;
        if(streak>best){best=streak;store('ph-best',String(best));}
        if(streak>0&&streak%4===0)bump(g.id,true);
        els.say.textContent=txt(pick(GOOD));
        els.streak.textContent=streak>1?(streak+' '+t('inARow')):'';
        drop(10,true);setTimeout(ask,1050);
      }else{
        b.classList.add('nearly');TRY();
        if(streak===0)bump(g.id,false);
        streak=0;els.say.textContent=txt(pick(NEARLY));els.streak.textContent='';
        setTimeout(function(){b.classList.remove('nearly');},700);
      }
    });
    els.opts.appendChild(b);
  });
}
els.help.addEventListener('click',function(){els.hint.classList.toggle('show');beep([440,587],.08);});

function play(g){
  cur=g;streak=0;played[g.id]=1;store('ph-played',JSON.stringify(played));
  els.title.textContent=txt(g.name);els.sub.textContent=txt(g.note);
  show('game',true);ask();
}

/* ---------------- menus ---------------- */
var HOME_TILES=[
  ['maths','➕','gMaths','gMathsN'],['world','🌍','gWorld','gWorldN'],
  ['stars','⭐','gStars','gStarsN'],['nails','💅','gNails','gNailsN'],
  ['party','🎉','gParty','gPartyN'],['random','🎲','gRandom','gRandomN']
];
function buildHome(){
  var w=document.getElementById('homeTiles');w.innerHTML='';
  HOME_TILES.forEach(function(h){
    var b=document.createElement('button');b.className='tile';
    b.innerHTML='<span class="em">'+h[1]+'</span>'+t(h[2])+'<small>'+t(h[3])+'</small>';
    b.addEventListener('click',function(){
      TAP();
      if(h[0]==='random'){backTo='home';play(pick(GAMES));return;}
      if(h[0]==='maths'||h[0]==='world'||h[0]==='stars'){backTo=h[0];show(h[0],false);return;}
      backTo='home';show(h[0],true);
    });
    w.appendChild(b);
  });
}
function buildMenu(cat,into){
  var host=document.getElementById(into);host.innerHTML='';
  var groups=[];
  GAMES.filter(function(g){return g.cat===cat;}).forEach(function(g){
    if(groups.indexOf(g.grp)===-1)groups.push(g.grp);
  });
  groups.forEach(function(grp){
    var h=document.createElement('div');h.className='grouphead';h.textContent=t(grp);
    host.appendChild(h);
    var tiles=document.createElement('div');tiles.className='tiles';
    GAMES.filter(function(g){return g.cat===cat&&g.grp===grp;}).forEach(function(g){
      var b=document.createElement('button');b.className='tile';
      b.innerHTML='<span class="em">'+g.em+'</span>'+txt(g.name)+'<small>'+txt(g.note)+'</small>'
        +'<span class="lv">'+t('level')+' '+levelOf(g.id)+(played[g.id]?'':' · '+t('newTag'))+'</span>';
      b.addEventListener('click',function(){TAP();play(g);});
      tiles.appendChild(b);
    });
    host.appendChild(tiles);
  });
}

/* ---------------- navigation ---------------- */
var backBtn=document.getElementById('back'),backTo='home',curScreen='home',curDeep=false;
function show(id,deep){
  curScreen=id;curDeep=!!deep;
  [].slice.call(document.querySelectorAll('.screen')).forEach(function(s){s.classList.toggle('on',s.id==='s-'+id);});
  backBtn.classList.toggle('on',!!deep);
  [].slice.call(document.querySelectorAll('.tab')).forEach(function(tb){tb.setAttribute('aria-pressed',String(tb.dataset.tab===id));});
  if(id==='maths')buildMenu('maths','mathsGroups');
  if(id==='world')buildMenu('world','worldGroups');
  if(id==='stars')paintStars();
  window.scrollTo({top:0,behavior:'smooth'});
}
backBtn.addEventListener('click',function(){TAP();show(backTo,false);});
[].slice.call(document.querySelectorAll('.tab')).forEach(function(tb){
  tb.addEventListener('click',function(){TAP();backTo=tb.dataset.tab;show(tb.dataset.tab,false);});
});

/* ---------------- party button ---------------- */
var LINES=[B('YOU PRESSED IT!','¡LO APRETASTE!'),B('Do it again!','¡Otra vez!'),B('That was the best one yet','Esa fue la mejor'),
  B('Official party expert','Experta oficial en fiestas'),B('Certified excellent nails','Uñas excelentes certificadas'),
  B('Ten out of ten','Diez de diez'),B('The crowd goes wild','El público enloquece'),B('You are extremely good at this','Eres buenísima en esto'),
  B('Very good!','¡Muy bien!'),B('Best boss ever','La mejor jefa'),B('Still the boss','Sigues siendo la jefa')];
var pn=0;
document.getElementById('go').addEventListener('click',function(){
  document.getElementById('yay').textContent=txt(LINES[pn%LINES.length]);pn++;drop(14,true);WIN();
});

/* ---------------- paint all static labels ---------------- */
function paintLang(){
  document.documentElement.lang=LANG;
  [].slice.call(document.querySelectorAll('[data-t]')).forEach(function(el){
    var v=t(el.dataset.t);
    if(/<br>/.test(v))el.innerHTML=v; else el.textContent=v;
  });
  backBtn.textContent=t('back');
  els.help.textContent=t('showMe');
  document.getElementById('lang').textContent=LANG==='en'?'ES':'EN';
  buildHome();
  if(curScreen==='maths')buildMenu('maths','mathsGroups');
  if(curScreen==='world')buildMenu('world','worldGroups');
  if(curScreen==='stars')paintStars();
  if(curScreen==='game'&&cur){els.title.textContent=txt(cur.name);els.sub.textContent=txt(cur.note);ask();}
  applyTheme();
  paintStars();
  paintStuck();
}
document.getElementById('lang').addEventListener('click',function(){
  LANG=LANG==='en'?'es':'en';store('ph-lang',LANG);
  store('ph-bothlang','1');
  TAP();paintLang();
});

paintLang();
})();
